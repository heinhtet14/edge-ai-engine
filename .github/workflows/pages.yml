# Deploys site/ to GitHub Pages.
# Manual trigger only while the repo is private (Pages on private repos needs GitHub Pro).
# When the repo goes public: enable Pages (Settings → Pages → Source: GitHub Actions)
# and uncomment the push trigger below.
name: Deploy site

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["site/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
